services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_matcher
      POSTGRES_USER: resume_matcher
      POSTGRES_PASSWORD: resume_matcher
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://resume_matcher:resume_matcher@db:5432/resume_matcher
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
